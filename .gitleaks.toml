# ==============================================================================
# ETF Yatırım Masası — Gitleaks Security Policy (.gitleaks.toml)
# Engine: Gitleaks 8.30.1
# Inherits default rules & extends with banking, broker, and PII detection.
# ==============================================================================

title = "ETF Yatirim Masasi Gitleaks Security Policy"

# Inherit all standard Gitleaks 8.30.1 rules (AWS, GitHub PATs, JWT, private keys, API secrets)
[extend]
useDefault = true

# ------------------------------------------------------------------------------
# Global Path Allowlists
# Bypasses local development virtualenvs, tool caches, lockfiles, and agent metadata
# ------------------------------------------------------------------------------
[allowlist]
description = "Global allowlist for dependencies, environments, build artifacts and agent coordination"
paths = [
    '''(^|/)\.venv/''',
    '''(^|/)masa/\.venv/''',
    '''(^|/)\.git/''',
    '''(^|/)\.pytest_cache/''',
    '''(^|/)\.ruff_cache/''',
    '''(^|/)\.mypy_cache/''',
    '''(^|/)__pycache__/''',
    '''(^|/)uv\.lock$''',
    '''(^|/)\.agents/teamwork/''',
    '''(^|/)\.build/''',
    '''(^|/)macos/\.build/''',
    '''(^|/)(?:masa/)?var/''',
    '''(^|/)arsiv/'''
]

# ------------------------------------------------------------------------------
# Rule 1: Standalone Uppercase European & Turkish IBANs
# Complies with ISO 13616-1 (min 15 chars, uppercase country code + check digits).
# Distinct from 12-character ISIN codes.
# ------------------------------------------------------------------------------
[[rules]]
id = "iban-standalone"
description = "Exposed Standalone International Bank Account Number (IBAN)"
regex = '''\b(TR[0-9]{2}[0-9]{5}[0-9A-Z]{17}|DE[0-9]{2}[0-9]{8}[0-9]{10}|FR[0-9]{2}[0-9]{10}[0-9A-Z]{11}[0-9]{2}|GB[0-9]{2}[A-Z]{4}[0-9]{14}|NL[0-9]{2}[A-Z]{4}[0-9]{10}|[A-Z]{2}[0-9]{2}[0-9A-Z]{11,30})\b'''
keywords = ["TR", "DE", "FR", "GB", "NL", "ES", "IT", "AT", "CH", "BE", "LU"]

[rules.allowlist]
description = "Permitted mock/test/documentation IBANs, ISINs, and citation URLs"
regexes = [
    '''TR[0]{24}''',
    '''DE[0]{20}''',
    '''DE89370400440532013000''',
    '''(?i)SAMPLE|EXAMPLE|TEST|MOCK|DUMMY''',
    '''https?://[^\s]+'''
]

# ------------------------------------------------------------------------------
# Rule 2: Contextual / Labeled IBANs
# Detects IBANs labeled with keywords even if spaces or lowercase characters are used
# ------------------------------------------------------------------------------
[[rules]]
id = "iban-contextual"
description = "Exposed IBAN with explicit label"
regex = '''(?i)(?:iban|konto|hesap|bankverbindung|bank[-_]?account)[^a-zA-Z0-9\n]{0,10}([A-Z]{2}[0-9]{2}[0-9A-Z]{11,30})'''
secretGroup = 1
keywords = ["iban", "konto", "hesap", "bankverbindung", "account"]

[rules.allowlist]
description = "Permitted sample IBANs in documentation or tests"
regexes = [
    '''(?i)TR[0]{24}''',
    '''(?i)DE[0]{20}''',
    '''(?i)DE89370400440532013000''',
    '''(?i)SAMPLE|EXAMPLE|TEST|MOCK|DUMMY'''
]

# ------------------------------------------------------------------------------
# Rule 3: Broker Session Keys & Authentication Tokens
# Detects exposed Scalable Capital or generic broker API keys and session tokens
# ------------------------------------------------------------------------------
[[rules]]
id = "broker-session-token"
description = "Exposed Broker or Scalable Capital session token / API secret"
regex = '''(?i)(?:scalable|broker|portfolio|session)[-_]?(?:token|secret|key|auth|jwt)[^a-zA-Z0-9\n]{0,10}['"][a-zA-Z0-9_\-\.]{20,}['"]'''
keywords = ["scalable", "broker", "session", "portfolio"]

[rules.allowlist]
description = "Permitted example/test tokens"
regexes = [
    '''(?i)example|sample|test|mock|dummy|placeholder'''
]

# ------------------------------------------------------------------------------
# Rule 4: Database Connection Strings with Passwords
# Detects database URLs containing plaintext credentials
# ------------------------------------------------------------------------------
[[rules]]
id = "database-connection-uri"
description = "Exposed Database Connection URI containing credentials"
regex = '''(?i)(?:postgres|postgresql|mysql|mssql|oracle|redis):\/\/[^:\s]+:[^@\s]+@[a-zA-Z0-9_\-\.]+:[0-9]+'''
keywords = ["postgres", "postgresql", "mysql", "mssql", "oracle", "redis"]

[rules.allowlist]
description = "Permitted test/documentation database URIs"
regexes = [
    '''(?i)localhost|127\.0\.0\.1|example\.com'''
]

# ------------------------------------------------------------------------------
# Rule 5: Turkish National Identity Number (TCKN) with context
# Protects against inadvertent leakage of Turkish National Identity Numbers
# ------------------------------------------------------------------------------
[[rules]]
id = "tckn-identity-number"
description = "Exposed Turkish National Identity Number (TCKN)"
regex = '''(?i)(?:tc|tckn|kimlik)[^a-zA-Z0-9\n]{0,10}\b([1-9][0-9]{10})\b'''
keywords = ["tc", "tckn", "kimlik"]

[rules.allowlist]
description = "Permitted test TCKNs"
regexes = [
    '''(?i)11111111110|12345678901|00000000000|SAMPLE|EXAMPLE|TEST'''
]

# ------------------------------------------------------------------------------
# Rule 6: Personal Name & Portfolio Owner Detection
# ------------------------------------------------------------------------------
[[rules]]
id = "personal-name-portfolio-owner"
description = "Portföy Sahibi ve gerçek kimlik adı tespiti"
regex = '''(?i)(portf[oö]y\s+sahibi|saime\s+berrin|saime|berrin)'''
tags = ["personal-data", "identity"]

# ------------------------------------------------------------------------------
# Rule 7: Personal Email Detection (Excluding GitHub noreply)
# ------------------------------------------------------------------------------
[[rules]]
id = "personal-email"
description = "Kişisel genel e-posta adresi tespiti"
regex = '''(?i)[A-Za-z0-9._%+-]+@(?:gmail|hotmail|yahoo|outlook|icloud)\.com'''
tags = ["personal-data", "email"]

[rules.allowlist]
description = "Permitted sample or noreply emails"
regexes = [
    '''(?i)users\.noreply\.github\.com''',
    '''(?i)example\.com'''
]

# ------------------------------------------------------------------------------
# Rule 8: Personal User Path Detection
# ------------------------------------------------------------------------------
[[rules]]
id = "personal-user-path"
description = "macOS kullanıcı ev dizini (/Users/<kullanici>/) sızıntısı"
regex = '''/Users/[a-zA-Z0-9._-]+/'''
tags = ["personal-data", "filesystem"]

[rules.allowlist]
description = "Permitted mock paths in tests and documentation"
regexes = [
    '''/Users/(?:user|test|testuser)/''',
    '''(?i)sample|example|test|mock|dummy'''
]

# ------------------------------------------------------------------------------
# Rule 9: ISIN & Quantity Table Detection
# ------------------------------------------------------------------------------
[[rules]]
id = "isin-quantity-table"
description = "ISIN kodu ve pay adedi içeren portföy tablosu sızıntısı"
regex = '''(?i)\|?\s*`?(?:IE00|US[0-9]|DE[0-9])[A-Z0-9]{8,10}`?\s*\|[^|\n]*\|\s*\d+(?:[.,]\d+)?\s*(?:adet|ad)?\s*\|'''
tags = ["personal-data", "portfolio"]

[rules.allowlist]
description = "Allow research quote spread tables without portfolio holdings"
paths = [
    '''Yatirim-Masasi/raporlar/2026-10-23-tarihsel-fiyat-makas\.md'''
]

